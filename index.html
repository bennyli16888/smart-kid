<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#f5fcf4">
  <meta name="description" content="萌学园：看图认字、生活英语和有实物解法的加减法，原创萌宠陪你学。">
  <title>萌学园 · 和小伙伴一起学</title>
  <link rel="icon" type="image/png" href="css/favicon.png?v=0.8.0">
  <link rel="stylesheet" href="css/style.css?v=0.8.0">
</head>
<body>
  <main class="app">
    <header class="topbar">
      <button id="home-button" class="icon-button home-button" aria-label="返回首页"><img class="home-button-icon" src="css/favicon.png?v=0.8.0" alt=""></button>
      <span class="brand">萌学园 <small>v0.8</small></span>
      <span class="star-badge" aria-label="获得的星星">⭐ <span id="stars">0</span></span>
      <div class="voice-picker">
        <button id="voice-picker-button" class="icon-button" aria-label="选择发音人" aria-expanded="false" aria-controls="voice-menu" disabled>🗣️</button>
        <div id="voice-menu" class="voice-menu" hidden>
          <p class="eyebrow">选择发音人</p>
          <div id="voice-options" class="voice-options" role="radiogroup" aria-label="发音人"></div>
          <p id="voice-status" role="status" aria-live="polite" hidden></p>
        </div>
      </div>
      <button id="sound-button" class="icon-button" aria-label="开启声音" aria-pressed="false"><span class="sound-icon" data-icon="muted" aria-hidden="true"><span>🔈</span><span class="mute-slash"></span></span></button>
    </header>
    <section id="screen-home" class="screen active" aria-label="学习设置">
      <div class="hero">
        <button class="companion-button" id="pick-character" aria-label="选择陪伴小伙伴"><span class="companion" data-size="160"></span><span id="character-name">小恐龙</span><small>🐾 换个小伙伴</small></button>
        <div><p class="eyebrow" id="world-name">小恐龙的森林课堂</p><h1>今天想<br>学什么呀？</h1><p class="subtitle">慢慢学，开心最重要。</p></div>
      </div>
      <div id="subject-row" class="subject-grid" role="group" aria-label="科目">
        <button class="subject-button" data-subject="zh"><span class="subject-icon">文</span><strong>语文</strong><small>看图认字 · 听听读音</small></button>
        <button class="subject-button" data-subject="math"><span class="subject-icon">+ −</span><strong>数学</strong><small>加一加 · 减一减</small></button>
        <button class="subject-button" data-subject="en"><span class="subject-icon">ABC</span><strong>英语</strong><small>生活图片 · 单词读音</small></button>
      </div>
      <div id="learning-settings" class="settings panel">
        <h2 id="level-heading">🌱 选个难度</h2>
        <div id="level-row" class="choice-row" role="group" aria-label="难度"></div>
        <label id="custom-range-field" class="input-field" hidden>最大数字（1—100）
          <input id="custom-range" type="number" min="1" max="100" step="1" value="30" inputmode="numeric">
        </label>
        <h2>🎒 这次学多少？</h2>
        <div id="count-row" class="choice-row" role="group" aria-label="题量">
          <button data-count="10">10</button><button data-count="20">20</button><button data-count="custom">自定义</button>
        </div>
        <label id="custom-count-field" class="input-field" hidden>自定义数量（1—100）
          <input id="custom-count" type="number" min="1" max="100" step="1" value="30" inputmode="numeric">
        </label>
        <div id="repeat-settings">
          <label class="check-field"><input id="allow-repeat" type="checkbox"> 可重复巩固</label>
          <div id="repeat-options" hidden>
            <h2>重复比例</h2>
            <div id="repeat-row" class="choice-row" role="group" aria-label="重复比例">
              <button data-repeat="0.1">10%</button><button data-repeat="0.2">20%</button><button data-repeat="0.3">30%</button>
            </div>
            <p class="subtitle">比例指本次学习中额外重复的次数，按四舍五入计算。</p>
          </div>
        </div>
        <p id="lesson-note" class="subtitle"></p>
        <p id="settings-error" role="alert"></p>
        <div class="lesson-entry-actions">
          <button id="start-button" class="primary">👀 看和听</button>
          <button id="find-button" class="secondary">🎧 听后找一找</button>
          <button id="counting-button" class="secondary" hidden>🔢 操作数一数</button>
        </div>
      </div>
      <p class="parent-note">给家长：无需按年龄选择，从简单开始。可以随时休息，不计时、不催促。</p>
    </section>

    <section id="screen-chars" class="screen" aria-label="选择角色">
      <h1>谁来陪你学？</h1><p class="subtitle">选好小伙伴，整个课堂都会换装哦。</p>
      <div id="character-grid" class="character-grid"></div>
    </section>

    <section id="screen-lesson" class="screen" aria-label="学习课堂">
      <div class="lesson-heading"><span class="companion" data-size="80"></span><div><h2 id="lesson-title"></h2><p id="lesson-progress"></p></div><button id="lesson-character" class="mini">🐾 换伙伴</button></div>
      <progress id="progress-bar" max="10" value="1" aria-label="学习进度"></progress>
      <article class="lesson-card panel">
        <div id="lesson-content"></div>
        <div class="lesson-tools">
          <button id="listen-button" class="listen-button">🔊 听一听</button>
          <button id="change-object" class="mini" aria-expanded="false" aria-controls="object-settings" hidden>换物品</button>
        </div>
        <p id="sound-status" class="subtitle" role="status" aria-live="polite" hidden></p>
        <div id="answers" class="answers"></div>
        <p id="feedback" role="status" aria-live="polite"></p>
        <div id="explain-actions" class="explain-actions" hidden>
          <button id="explain-button" class="secondary">🍬 讲给我听</button>
        </div>
        <div id="object-settings" class="object-picker" hidden>
          <p class="eyebrow">选一种喜欢的讲解物品</p>
          <div id="object-row" class="object-grid" role="group" aria-label="讲解实物"></div>
        </div>
        <div id="explanation" class="explanation" hidden>
          <p id="explain-text"></p><div id="star-scene" class="star-scene"></div>
          <button id="explain-next" class="secondary">▶ 下一步</button>
        </div>
      </article>
      <div class="navigation"><button id="previous-button" class="secondary">← 上一个</button><button id="next-button" class="primary">下一个 →</button></div>
    </section>

    <section id="screen-results" class="screen" aria-label="学习完成">
      <div class="results panel"><span class="companion" data-size="180"></span><h1>你真棒！</h1><p id="result-message"></p><p class="subtitle">伸个懒腰，看看远处，休息一下吧。</p><button id="again-button" class="primary wide">↻ 再学一次</button><button id="finish-button" class="secondary wide">⌂ 回到首页</button></div>
    </section>
  </main>
  <script src="js/data.js?v=0.3"></script>
  <script src="js/pictures.js?v=0.3"></script>
  <script src="js/characters.js?v=0.2"></script>
  <script src="js/audio.js?v=0.8.0"></script>
  <script src="js/app.js?v=0.8.0"></script>
</body>
</html>
